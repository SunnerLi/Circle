<!-- Usage: python3 -m http.server -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Circle機能地圖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 地圖 */
    #map { height: 100vh; width: 100%; }

    /* 店家標記 */
    .marker-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .color-button {
      padding: 6px 12px;
      margin: 2px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }

    .custom-marker {
      width: 25px;
      height: 41px;
      border-radius: 4px;
      position: relative;
      box-shadow: 0 0 2px rgba(0,0,0,0.5);
    }

    .custom-marker::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border: 6px solid transparent;
      border-top-color: inherit;
    }

    /* 控制面板 */
    .sub-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .sub-list.open {
      max-height: 500px; /* 根據內容大小調整 */
    }

    .toggle-btn.open {
      transform: rotate(90deg);
      transition: transform 0.3s ease;
    }

    .toggle-btn {
      transition: transform 0.3s ease;
    }

    .panel-content {
      max-height: 1000px; /* Adjust as needed, large enough for content */
      overflow: hidden;
      transition: max-height 0.5s ease-in-out;
    }

    .panel-content.collapsed {
      max-height: 0;
    }

    @media (max-width: 768px) {
      .control-panels-container {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        padding: 1rem;
        box-sizing: border-box;
        /* Remove space-x-2 effect by resetting margins */
      }
      .control-panels-container > .bg-white {
        margin-left: 0 !important;
        margin-bottom: 1rem;
        width: 100% !important; /* Override Tailwind w-48 and w-96 */
      }
      .control-panels-container > .bg-white:last-child {
        margin-bottom: 0;
      }
    }

    /* 每個機能項目 checkbox 左方的小型載入指示器 */
    .mini-spinner {
      flex: 0 0 14px;   /* 固定寬度，即使沒在載入也保留空間，避免版面跳動 */
      width: 14px;
      height: 14px;
      box-sizing: border-box;
      display: inline-block;
    }

    .mini-spinner.loading {
      border: 2px solid #e5e7eb;      /* 淺灰 */
      border-top: 2px solid #3498db;  /* 藍 */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- 控制面板 -->
  <div class="absolute top-4 right-4 flex items-start space-x-2 z-[1000] control-panels-container">
    <!-- 地區 Panel -->
    <div id="region-panel" class="bg-white rounded-xl shadow-lg p-4 font-sans w-48">
      <h2 id="region-panel-header" class="text-gray-800 text-sm font-semibold mb-2 cursor-pointer">地區</h2>
      <div id="region-panel-content" class="panel-content collapsed"></div>
    </div>

    <!-- 機能 Panel -->
    <div id="life-function-panel" class="bg-white rounded-xl shadow-lg p-4 font-sans w-96">
      <h2 id="life-function-panel-header" class="text-gray-800 text-sm font-semibold mb-2 cursor-pointer">機能選項</h2>
      <div id="life-function-panel-content" class="panel-content collapsed"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([25.0330, 121.5654], 13); // 台北市中心

    // 載入中功能：每個機能項目各自顯示載入指示器，不阻擋使用者操作，
    // 因此可以同時點選多個 checkbox。
    function show_item_spinner(itemId) {
      const slot = document.getElementById(`spinner-${itemId}`);
      if (slot) slot.classList.add('loading');
    }

    function hide_item_spinner(itemId) {
      const slot = document.getElementById(`spinner-${itemId}`);
      if (slot) slot.classList.remove('loading');
    }

    // 宣告圖層相關物件
    let circles = {}
    let markers = {}

    // 加入 OpenStreetMap 圖層
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 暫停函式
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Overpass 端點清單：依序輪替，一台掛掉自動換下一台。
    // 排序依實測可靠度：mail.ru 目前資料完整且 CORS 正常，排最前面；
    // 其餘三個目前個別有連線失敗/資料不全/逾時等問題，但仍保留作為備援，
    // 因為這類公用服務狀態會隨時間變化，機器不穩定可能只是暫時的。
    const OVERPASS_ENDPOINTS = [
      'https://maps.mail.ru/osm/tools/overpass/api/interpreter?data=',
      'https://overpass-api.de/api/interpreter?data=',
      'https://overpass.osm.ch/api/interpreter?data=',
      'https://overpass.kumi.systems/api/interpreter?data=',
    ];

    // 指數退避 + 隨機抖動：1s → 2s → 4s → 8s（上限），避免失敗時狂打被限流。
    function backoff_delay(attempt) {
      const base = Math.min(1000 * Math.pow(2, attempt), 8000);
      const jitter = Math.floor(Math.random() * 1000);
      return base + jitter;
    }

    // 查詢Open Street伺服器
    // searchPattern：實際拿去比對 OSM name 的正則字串（可能包含新舊品牌名稱，用 | 分隔）。
    // shop：項目的顯示名稱／身分識別鍵（用於 markers/circles/cache），兩者不一定相同。
    async function query_server(cities, category, shop, color, searchPattern) {
      let allResults = [];
      for (const city of cities) {
        const overpassQuery = `
          [out:json][timeout:25];
          area["name"="${city}"]->.searchArea;
          (
            node["name"~"${searchPattern}"](area.searchArea);
            way["name"~"${searchPattern}"](area.searchArea);
            relation["name"~"${searchPattern}"](area.searchArea);
          );
          out center;
        `;

        // 每台端點大約試兩輪
        const MAX_ATTEMPTS = OVERPASS_ENDPOINTS.length * 2;
        for (let i = 0; i < MAX_ATTEMPTS; i++) {
          const endpoint = OVERPASS_ENDPOINTS[i % OVERPASS_ENDPOINTS.length];
          const url = endpoint + encodeURIComponent(overpassQuery);

          try {
            const res = await fetch(url);
            if (res.ok) {
              const json = await res.json();
              console.log(`第${i}次 ${endpoint} #${shop}: ${json.elements.length} 筆`);
              if (json.elements.length > 0) {
                // (3) 收到有效 response 後，除了畫圖，也把內容寫進緩存
                const cacheKey = `${cities.join('_')}-${category}-${shop}`;
                updateCache(cacheKey, json);
                allResults.push(...json.elements);
                break;
              }
              // 回 0 筆：可能真的沒有，也可能是這台暫時異常。換下一台再確認，
              // 只做短暫延遲、不做長退避，避免拖慢「其實真的沒資料」的情況。
              await sleep(500);
            } else {
              // 非 2xx（429 限流 / 500 等）：退避後換下一台
              console.warn(`第${i}次 ${endpoint} 回應 ${res.status}，退避重試`);
              await sleep(backoff_delay(i));
            }
          } catch (e) {
            // 連線被拒 / CORS 被擋：同樣退避後換下一台
            console.error(`第${i}次 ${endpoint} 連線失敗（連線被拒或 CORS）:`, e.message);
            await sleep(backoff_delay(i));
          }
        }
      }

      // 將 Overpass API 格式轉換為 compute 函數期望的格式
      return allResults.map(el => {
        let lat = el.lat || (el.center && el.center.lat);
        let lon = el.lon || (el.center && el.center.lon);
        return {
          city: cities[0], // 注意：這裡簡化為第一個城市
          category: category,
          shop: shop,
          latitude: lat,
          longitude: lon,
          color: color
        };
      });
    }

    function compute(rows) {
      rows.forEach(row => {
        markers[row.category][row.shop] = markers[row.category][row.shop].concat(
          L.marker([row.latitude, row.longitude], {icon: createDivIcon(row.shop, row.color)})
        )
        circles[row.category][row.shop] = circles[row.category][row.shop].concat(
          L.circle([row.latitude, row.longitude], {
            radius: 200,
            color: row.color,
            fillOpacity: 0.1
          })
        )
      })
    }

    function createDivIcon(shop_name, color) {
      return L.divIcon({
        className: '',
        html: `<div class="custom-marker" style="background-color:${color}; border-top-color:${color};">
                <span>${shop_name}</span>
               </div>`,
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [0, -41]
      });
    }

    function draw(category, shop) {
      circles[category][shop].forEach(circle => {
        circle.addTo(map)
      })
      markers[category][shop].forEach(marker => {
        marker.addTo(map).bindPopup(shop)
      })
    }

    function erase(category, shop) {
      circles[category][shop].forEach(circle => {
        map.removeLayer(circle)
      })
      markers[category][shop].forEach(marker => {
        map.removeLayer(marker)
      })
    }

    // --- Caching functions ---
    const CACHE_KEY_PREFIX = 'mapCache';

    function getCache(key) {
      const cached = localStorage.getItem(`${CACHE_KEY_PREFIX}_${key}`);
      if (cached) {
        try {
          const data = JSON.parse(cached);
          // 確保返回的格式與 Overpass API 一致
          return data.elements ? data : { elements: data };
        } catch (e) {
          console.error("Failed to parse cache:", e);
          return null;
        }
      }
      return null;
    }

    function updateCache(key, data) {
        // 確保傳入的 data 有 elements 屬性
        const dataToCache = data.elements ? data : { elements: data };

        // (5) 請注意在更新緩存內容時，是更新內容不是覆蓋內容，如果緩存內部有10間鐵板燒餐廳的資訊，但當下與伺服器互動取到的response是0筆，則代表當下response有誤，不是直接覆蓋變成0筆
        if (!dataToCache || !dataToCache.elements || dataToCache.elements.length === 0) {
            const existingData = getCache(key);
            if (existingData && existingData.elements && existingData.elements.length > 0) {
                console.log(`Cache: Received 0 elements for ${key}. Preserving existing cache.`);
                return; // 不更新快取
            }
        }

        // (4) 請注意同一時間可能會有多個checkbox被點擊，並且有多個request與openstreet伺服器互動，每次response都會寫入緩存，因此要考慮是否有conflict並避免它
        // 解法：每個 request 都只寫自己的 key，不會互相影響
        try {
            localStorage.setItem(`${CACHE_KEY_PREFIX}_${key}`, JSON.stringify(dataToCache));
            console.log(`Cache: Updated cache for ${key}`);
        } catch (e) {
            console.error("Failed to update cache:", e);
            // 可選：增加更複雜的錯誤處理，例如清除部分舊快取
        }
    }

    /**
     * 處理點擊/取消點擊商店checkbox的行為
     */
    function toggle_shop(event, category, shop, color, searchPattern) {
      const itemId = event.target.id;
      searchPattern = searchPattern || shop; // 沒有另外指定 query 時，用顯示名稱本身當比對條件
      const selectedCities = get_selected_cities();
      const cacheKey = `${selectedCities.join('_')}-${category}-${shop}`;

      if (event.target.checked) {
        show_item_spinner(itemId); // 只顯示這個項目的載入圈圈，不阻擋其他操作
        try {
          const cachedData = getCache(cacheKey);

          if (cachedData && cachedData.elements.length > 0) {
            console.log(`Cache HIT for key: ${cacheKey}. Rendering from cache.`);
            const rows = cachedData.elements.map(el => {
              let lat = el.lat || (el.center && el.center.lat);
              let lon = el.lon || (el.center && el.center.lon);
              return {
                city: selectedCities[0],
                category: category,
                shop: shop,
                latitude: lat,
                longitude: lon,
                color: color
              };
            });
            compute(rows);
            draw(category, shop);
            hide_item_spinner(itemId); // 同步操作完成後隱藏
          } else {
            console.log(`Cache MISS for key: ${cacheKey}. Querying server.`);
            query_server(selectedCities, category, shop, color, searchPattern).then(rows => {
              compute(rows);
              draw(category, shop);
            }).finally(() => {
              hide_item_spinner(itemId); // 非同步操作完成後隱藏
            });
          }
        } catch (e) {
          console.error("Error in toggle_shop:", e);
          hide_item_spinner(itemId); // 即使發生同步錯誤也要隱藏
        }
      } else {
        erase(category, shop);
      }
    }

    function get_selected_cities() {
      const selectedCities = [];
      const regionCheckboxes = document.querySelectorAll('#region-panel input[type="checkbox"]:checked');
      regionCheckboxes.forEach(checkbox => {
        const label = checkbox.closest('label');
        if (label) {
          const span = label.querySelector('span');
          if (span) {
            selectedCities.push(span.textContent.trim());
          }
        }
      });
      return selectedCities.length > 0 ? selectedCities : ["台北市"]; // Default to 台北市 if none selected
    }

    /**
     * 處理點擊/取消點擊餐廳類別checkbox的行為
     */
    function toggle_category(event, category_id) {
      const mainCheckbox = document.getElementById(category_id)
      const itemDiv = mainCheckbox.closest('.mb-4')
      const subList = itemDiv.querySelector('.sub-list')
      const subCheckboxes = subList.querySelectorAll('input[type="checkbox"]')

      if (event.target.checked) {
        expandSublist(category_id)
        subCheckboxes.forEach(cb => {if (!cb.checked) {cb.click()}});
      } else {
        subCheckboxes.forEach(cb => {if (cb.checked) {cb.click()}});
      }
    }

    /**
     * 處理點擊地區checkbox的行為
     */
    function handle_region_change(regionId, regions) {
      const regionCheckboxes = document.querySelectorAll('#region-panel input[type="checkbox"]');
      regionCheckboxes.forEach(checkbox => {
        if (checkbox.id !== regionId) {
          checkbox.checked = false;
        }
      });

      const selectedRegion = regions.find(r => r.id === regionId);
      if (selectedRegion) {
        map.setView([selectedRegion.lat, selectedRegion.lng], 13);
      }
    }

    // UI渲染函數
    function createRegionBlock({ id, label }) {
      const container = document.createElement("div");
      container.className = "mb-2";
      container.innerHTML = `
        <label class="inline-flex items-center space-x-2 cursor-pointer">
          <input type="checkbox" id="${id}" class="w-5 h-5 accent-green-600 bg-white border-gray-300 rounded"/>
          <span class="text-sm text-gray-900">${label}</span>
        </label>
      `;
      return container;
    }

    function createCategoryBlock({ id, label, items }) {
      const container = document.createElement("div");
      container.className = "mb-4 border-b border-gray-300";
      container.innerHTML = `
        <div class="flex justify-between items-center">
          <label class="inline-flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="${id}" class="w-5 h-5 accent-green-600 bg-white border-gray-300 rounded"/>
            <span class="text-sm text-gray-900">${label}</span>
          </label>
          <button class="toggle-btn text-gray-600">▶</button>
        </div>

        <div class="sub-list pl-6 flex flex-wrap mt-2">
          ${items.map(item => `
            <div class="flex items-center space-x-1 w-1/3 mb-2">
              <span class="mini-spinner" id="spinner-${item.id}"></span>
              <label class="inline-flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="${item.id}" class="w-5 h-5 accent-green-600 bg-white border-gray-300 rounded"/>
                <span class="text-sm text-gray-900">${item.label}</span>
              </label>
            </div>
          `).join('')}
        </div>
      `;
      return container;
    }

    // 手動展開子列表
    function expandSublist(mainId, expand = true) {
      const mainCheckbox = document.getElementById(mainId);
      const itemDiv = mainCheckbox?.closest(".mb-4");
      const subList = itemDiv?.querySelector(".sub-list");
      const toggleBtn = itemDiv?.querySelector(".toggle-btn");

      if (subList && toggleBtn) {
        subList.classList.toggle("open", expand);
        toggleBtn.classList.toggle("open", expand);
      }
    }

    // 讀取JSON設定檔並根據內容渲染面板
    fetch('setting.json', { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        // 初始化圖層相關變數
        data["life_function"].forEach(cat => {
          circles[cat["label"]] = {}
          markers[cat["label"]] = {}
          cat["items"].forEach(item => {
            circles[cat["label"]][item["label"]] = []
            markers[cat["label"]][item["label"]] = []
          })
        })

        // 定位並動態插入地區面板
        const regionPanelContent = document.getElementById("region-panel-content");
        data["regions"].forEach(region => {
          const block = createRegionBlock(region);
          regionPanelContent.appendChild(block);
        });

        // 綁定地區選擇事件
        data["regions"].forEach(region => {
          const checkbox = document.getElementById(region.id);
          checkbox.addEventListener('change', (event) => {
            if (event.target.checked) {
              handle_region_change(region.id, data.regions);
            }
          });
        });

        // 設定預設選取台北市
        const tpeCheckbox = document.getElementById('check_tpe');
        if (tpeCheckbox) {
          tpeCheckbox.checked = true;
        }

        // 定位並動態插入生活機能面板
        const lifeFunctionPanelContent = document.getElementById("life-function-panel-content");
        data["life_function"].forEach(cat => {
          const block = createCategoryBlock(cat);
          lifeFunctionPanelContent.appendChild(block);
        });

        // 綁定選單展開隱藏
        document.querySelectorAll('.toggle-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const subList = btn.parentElement.nextElementSibling;
            const isOpen = subList.classList.contains('open');
            subList.classList.toggle('open', !isOpen);
            btn.classList.toggle('open', !isOpen);
          });
        });

        // 綁定外&內層列表點擊事件
        data["life_function"].forEach(cat => {
          document.getElementById(cat["id"]).addEventListener('change', (event) => {toggle_category(event, cat["id"])});
          cat["items"].forEach(item => {
            document.getElementById(item["id"]).addEventListener('change', (event) => {toggle_shop(event, cat["label"], item["label"], cat["color"], item["query"])})
          })
        });

        // 綁定 Panel 收合事件
        document.getElementById('region-panel-header').addEventListener('click', () => {
            document.getElementById('region-panel-content').classList.toggle('collapsed');
        });

        document.getElementById('life-function-panel-header').addEventListener('click', () => {
            document.getElementById('life-function-panel-content').classList.toggle('collapsed');
        });
      })
  </script>
</body>
</html>
